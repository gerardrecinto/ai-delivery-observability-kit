[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidelivery"
version = "0.1.0"
description = "Cost attribution, quotas, and canary verification gates for AI inference workloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["prometheus_client>=0.20"]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aidelivery = "aidelivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aidelivery = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
