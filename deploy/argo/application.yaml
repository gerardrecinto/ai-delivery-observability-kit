# Argo CD Application that syncs the Helm chart from this repo. Illustrative, not applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-serving
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gerardrecinto/ai-delivery-observability-kit.git
    targetRevision: main
    path: deploy/helm/vllm-serving
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
